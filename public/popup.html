<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScreenHawk</title>
  <link rel="stylesheet" href="ui.css">
  <script src="popup.js" defer></script>
</head>
<body class="popup">
  <header class="brand"><img src="icons/icon-32.png" alt="" width="28" height="28"><h1>ScreenHawk</h1></header>
  <p class="muted">Ask about an area or draft text for a text box.</p>
  <div class="actions">
    <button id="capture" type="button">Select area</button>
    <button id="wand" class="secondary" type="button">Choose field</button>
    <button id="draft" class="secondary" type="button">Draft for field</button>
  </div>
  <a id="settings" href="options.html" target="_blank">Settings</a>
  <p id="status" role="status"></p>
</body>
</html>

name: Draft changelog

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    if: github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'changelog/') && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Draft a changelog entry for the merged pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="changelog/pr-${PR_NUMBER}"
          existing_pr=$(gh pr list --head "$branch" --json url --jq '.[0].url // empty')
          if [ -n "$existing_pr" ]; then
            echo "Draft pull request already exists: $existing_pr" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch_exists=false
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            branch_exists=true
            git fetch origin "$branch"
            git switch --track -c "$branch" "origin/$branch"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Unable to check whether $branch already exists (git ls-remote exit $status)" >&2
              exit "$status"
            fi
            git switch -c "$branch"
          fi
          node scripts/changelog.js add
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard -- changelog)"; then
            if [ "$branch_exists" = false ]; then
              echo "No new draft changelog entry"
              exit 0
            fi
            echo "Existing changelog branch has no new changes; retrying draft pull request creation."
          else
            git add changelog
            git commit -m "Draft changelog for PR #${PR_NUMBER}"
            git push origin "$branch"
          fi
          if output=$(gh pr create --draft --base main --head "$branch" --title "Changelog for PR #${PR_NUMBER}" --body-file .github/changelog-draft-pr-body.md 2>&1); then
            echo "$output"
          else
            status=$?
            if printf '%s' "$output" | grep -Fq 'GitHub Actions is not permitted to create or approve pull requests'; then
              compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
              {
                echo "## Draft changelog ready for manual pull request"
                echo
                echo "GitHub Actions pushed the changelog branch, but repository policy refused pull request creation. Open the draft from this compare link: ${compare_url}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            printf '%s\n' "$output" >&2
            exit "$status"
          fi
